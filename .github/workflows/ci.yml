name: CollegeSync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
permissions:
  contents: write    

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Automatically fix formatting and lint errors
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit and Push fixes back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
         commit_message: "style: auto-fix formatting issues via GitHub Actions"
